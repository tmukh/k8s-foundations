apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: m1-allow-client
  namespace: k8s-foundations
spec:
  podSelector:
    matchLabels:
      app: m1-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: m1-client
      ports:
        - protocol: TCP
          port: 80